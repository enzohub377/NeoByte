<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login NeoByte</title>
</head>

<body>

    <form action="#">
        <header>
            <h1>Login</h1>
        </header>

        <div class="Fill">
            <div class="Fill__field">
                <input type="email" name="nome" pattern=".+@gmail.com" required placeholder=" ">
                <label for="nome">Email</label>
            </div>

            <div class="Fill__field">
                <input id="password" type="password" name="senha" required placeholder=" ">
                <label for="password">Senha</label>
            </div>
        </div>

        <div class="To-Enter">
            <a class="Vind" href="http://127.0.0.1:5500/P%C3%A1gina%20Principal/index.html">Entrar</a>
            <h2>Ainda não tem uma conta?</h2>
            <a class="Change" href="http://127.0.0.1:5500/Cadastro%20da%20NeoByte/index.html">Faça o seu Cadastro</a>
        </div>
    </form>

    <div class="Background">
        <div class="Background-Frame">
            <img src="../Assets/Form-Background.png" alt="">
        </div>
    </div>

</body>

</html>
