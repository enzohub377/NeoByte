<!doctype html>
<html lang="pt-br">
  <head>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="../Assets/Icon.png" type="image/png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login NeoByte</title>
  </head>

  <body>
    <form action="#">
      <header>
        <h1>Login</h1>
      </header>

      <div class="Fill">
        <div class="Fill__field">
          <input
            type="email"
            name="email"
            required
            pattern=".+gmail\.com|.+hotmail\.com"
            placeholder=" "
            title="Por favor, insira um e-mail válido do Gmail ou Hotmail."
          />
          <label for="email">Email</label>
        </div>

        <div class="Fill__field">
          <input
            id="password"
            type="password"
            name="senha"
            required
            placeholder=" "
            title="Insira a sua senha."
          />
          <label for="password">Senha</label>
          <div id="toggle" onclick="showHide()"></div>
        </div>
      </div>

      <div class="To-Enter">
        <button type="submit">Entrar</button>
        <p>Ainda não tem uma conta?</p>
        <a class="Change" href="../Cadastro/index.html"
          >Faça o seu Cadastro</a
        >
      </div>
    </form>

    <div class="Background">
      <div class="Background-Frame">
        <img src="../Assets/Form-Background.png" alt="" />
      </div>
    </div>

    <script src="../assets/js/script.js"></script>
  </body>
</html>
